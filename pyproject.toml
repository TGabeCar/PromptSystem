[project]
name = "workflow-cli"
version = "1.0.0"
description = "AI Workflow Prompt Organizer — a terminal app that organizes and serves AI workflow prompts for software development projects."
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "pyperclip>=1.8",
    "pyyaml>=6.0",
]

[project.scripts]
workflow = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
